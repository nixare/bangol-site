<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bangol – Scarica</title><meta name="theme-color" content="#1B1512"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="stylesheet" href="style.css">
<script>
// One link for the QR at the end of a match (09/10/2026): the phone's own store, the referrer
// code passed on where the store keeps it (Play's install referrer; Apple keeps none).
(function () {
  var q = location.search.replace(/^\?/, "");
  var ua = navigator.userAgent || "";
  var apple = "https://apps.apple.com/app/id6811360804?pt=bangol&ct=" + encodeURIComponent(q || "qr") + "&mt=8";
  var play = "https://play.google.com/store/apps/details?id=com.nixare.bangol&referrer=" + encodeURIComponent(q || "utm_source=qr");
  // Play is not public yet (20/11/2026): Android stays here and reads «presto». Back to
  // `if (/android/i.test(ua)) location.replace(play); else if (` when production is out.
  if (/iphone|ipad|ipod|macintosh/i.test(ua) && "ontouchend" in document || /iphone|ipad|ipod/i.test(ua)) location.replace(apple);
  window.__stores = { apple: apple, play: play };
})();
</script></head><body>
<header class="page-top"><div class="wrap"><a class="brand" href="index.html"><img src="img/icon.webp" alt="" width="34" height="34">Bangol</a>
<nav aria-label="Pagine / Pages"><a href="index.html#supporto">Supporto / Support</a><a href="privacy.html">Privacy</a></nav></div></header>
<main class="doc">
<article class="paper">
<h1>Bangol</h1>
<p>Il duello foto a due, sul tuo telefono. / The photo duel for two, on your own phone.</p>
<div class="stores">
<a class="badge" id="apple" href="https://apps.apple.com/app/id6811360804"><img id="badge" src="img/app-store-badge-it.svg" alt="Scarica su App Store / Download on the App Store" width="162" height="54"></a>
<span class="store" style="background:var(--darkroom);color:var(--sheet);opacity:.7" id="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5v17l14-8.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span><small>Android</small><b>Presto · Soon</b></span></span>
</div>
</article>
<script>if (window.__stores) { document.getElementById("apple").href = __stores.apple; }
if (!/^it\b/i.test(navigator.language || "it")) document.getElementById("badge").src = "img/app-store-badge-en.svg";</script>
</main>
